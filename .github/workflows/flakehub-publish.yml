name: Publish to FlakeHub

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: cachix/cachix-action@v17
        with:
          name: openchamber
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#openchamber-server --print-build-logs
      - run: nix run fh -- push
        env:
          FH_TOKEN: ${{ secrets.FLAKEHUB_TOKEN }}
