name: "Publish main to FlakeHub with version tag"
on:
  push:
    branches:
      - "main"
jobs:
  flakehub-publish:
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
      - uses: "DeterminateSystems/determinate-nix-action@v3"
      - name: "Read version from versions.nix"
        id: "version"
        run: |
          version="$(nix eval --raw -f versions.nix version)"
          if [ -z "$version" ]; then
            echo "versions.nix yielded an empty version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: "DeterminateSystems/flakehub-push@main"
        with:
          name: "x13-me/openchamber-nix"
          tag: "v${{ steps.version.outputs.version }}"
          visibility: "public"
          include-output-paths: true
